# metric-shelf 运行时概念清单（ABox 的可读投影）
# Agent / Skill 查阅本文件做语义锚定。全量为空模板：由业务治理流程逐步填入。
# 禁止写入离线评测问句及其标准答案路径。

version: 1
namespace: urn:aiops:metric-shelf

# 指标意图桶（与 schema.ttl 中 MetricIntent 对齐；可扩展，勿删已有 id）
metric_intents:
  - id: intent.success_rate_like
    label: success_rate_like
    utterances: ["成功率", "成功占比", "请求成功比例"]
    disambiguation_hints:
      - "成功/通过/OK 类结果占比"
  - id: intent.fill_rate_like
    label: fill_rate_like
    utterances: ["填充率", "补给率"]
    disambiguation_hints:
      - "供给/填充侧占比"
  - id: intent.exposure_or_click_rate_like
    label: exposure_or_click_rate_like
    utterances: ["曝光率", "点击率", "触达率"]
    disambiguation_hints:
      - "曝光/点击/触达类交互占比"
  - id: intent.count_like
    label: count_like
    utterances: ["次数", "总量", "计数"]
    disambiguation_hints:
      - "计数或总量"
  - id: intent.latency_like
    label: latency_like
    utterances: ["时延", "耗时", "延迟"]
    disambiguation_hints:
      - "时延或耗时"

